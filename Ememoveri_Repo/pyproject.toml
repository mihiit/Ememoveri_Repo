[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ememoveri"
version = "0.6.5"
description = "Evidence-Aware Engineering Memory for Repository-Scoped Coding Agents: mechanism library and leakage-controlled real-history benchmark"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Mihit", email = "mihit.nanda.cs27@iilm.edu"}, {name = "Priyanka Tyagi"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
figures = ["matplotlib>=3.7", "numpy>=1.24"]
bench = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7"]
ext = ["spacy>=3.7"]          # static word vectors: python -m spacy download en_core_web_md
pilot = ["pydriller", "groq"]
all = ["pytest>=7.0", "matplotlib>=3.7", "numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
include = ["ememoveri*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
