name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[dev,bench]"
      - name: Run tests
        run: pytest -q

  experiments:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + plotting deps
        run: |
          pip install -e ".[dev,bench]"
          pip install matplotlib numpy
      - name: Run all mechanism-layer experiments and generate figures
        run: python -m experiments.run_all
      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: ememoveri-results
          path: results/
